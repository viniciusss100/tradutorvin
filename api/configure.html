<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Translate Subtitles</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0d0d1a;color:#eee;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem}
    .lang-toggle{display:flex;gap:.5rem;margin-bottom:2rem;align-self:flex-end}
    .lang-toggle button{background:none;border:1px solid #444;color:#aaa;padding:.3rem .7rem;border-radius:20px;cursor:pointer;font-size:.8rem}
    .lang-toggle button.active{border-color:#7ec8e3;color:#7ec8e3}
    .hero{text-align:center;margin-bottom:2rem}
    .hero h1{font-size:1.6rem;color:#fff;margin-bottom:.5rem}
    .hero h1 span{color:#7ec8e3}
    .hero p{color:#aaa;font-size:.95rem;max-width:480px;line-height:1.5}
    .card{background:#16213e;border-radius:14px;padding:2rem;width:100%;max-width:460px;box-shadow:0 4px 32px #0009;margin-bottom:1.5rem}
    .card h2{font-size:1rem;color:#7ec8e3;margin-bottom:1.2rem}
    label{display:block;font-size:.82rem;color:#aaa;margin-bottom:.3rem}
    select,input{width:100%;padding:.6rem .8rem;border-radius:7px;border:1px solid #2a3a5c;background:#0f2040;color:#eee;font-size:.92rem;margin-bottom:1rem}
    small{display:block;color:#556;font-size:.75rem;margin-top:-.6rem;margin-bottom:.9rem}
    .btn-install{width:100%;padding:.8rem;border-radius:8px;border:none;background:linear-gradient(90deg,#7ec8e3,#4fa8c8);color:#0d0d1a;font-weight:700;font-size:1rem;cursor:pointer;transition:opacity .2s}
    .btn-install:hover{opacity:.85}
    #result{margin-top:1.2rem;display:none}
    #result p{font-size:.78rem;color:#aaa;margin-bottom:.3rem}
    #result a.manifest{display:block;word-break:break-all;color:#7ec8e3;font-size:.78rem;margin-bottom:.8rem}
    #result a.open-stremio{display:block;text-align:center;padding:.7rem;background:#e94560;color:#fff;border-radius:8px;text-decoration:none;font-weight:700;font-size:.95rem}
    .debrid-card{background:#16213e;border-radius:14px;padding:1.5rem;width:100%;max-width:460px;box-shadow:0 4px 32px #0009}
    .debrid-card h2{font-size:1rem;color:#f0a500;margin-bottom:.4rem}
    .debrid-card p{font-size:.85rem;color:#aaa;line-height:1.5;margin-bottom:1rem}
    .debrid-links{display:flex;gap:.8rem;flex-wrap:wrap}
    .debrid-links a{flex:1;min-width:140px;display:block;text-align:center;padding:.65rem .5rem;border-radius:8px;font-weight:700;font-size:.88rem;text-decoration:none;transition:opacity .2s}
    .debrid-links a:hover{opacity:.85}
    .btn-torbox{background:linear-gradient(90deg,#f0a500,#e07b00);color:#0d0d1a}
    .btn-rd{background:linear-gradient(90deg,#4caf50,#2e7d32);color:#fff}
    footer{margin-top:1.5rem;color:#444;font-size:.75rem}
  </style>
</head>
<body>

<div class="lang-toggle">
  <button class="active" onclick="setLang('pt')">🇧🇷 PT</button>
  <button onclick="setLang('en')">🇺🇸 EN</button>
</div>

<div class="hero">
  <h1>🎬 <span>Auto Translate</span> Subtitles</h1>
  <p class="i18n" data-pt="Traduza legendas automaticamente para o seu idioma enquanto assiste no Stremio — sem configuração complicada."
                  data-en="Automatically translate subtitles to your language while watching on Stremio — no complicated setup."></p>
</div>

<div class="card">
  <h2 class="i18n" data-pt="⚙️ Configurar Addon" data-en="⚙️ Configure Addon"></h2>

  <label class="i18n" data-pt="Idioma de destino" data-en="Target language"></label>
  <select id="targetLang">
    <option value="pt">🇧🇷 Português (BR)</option>
    <option value="es">🇪🇸 Espanhol / Spanish</option>
    <option value="fr">🇫🇷 Francês / French</option>
    <option value="de">🇩🇪 Alemão / German</option>
    <option value="it">🇮🇹 Italiano / Italian</option>
    <option value="pl">🇵🇱 Polonês / Polish</option>
    <option value="tr">🇹🇷 Turco / Turkish</option>
    <option value="ru">🇷🇺 Russo / Russian</option>
    <option value="ar">🇸🇦 Árabe / Arabic</option>
    <option value="zh">🇨🇳 Chinês / Chinese</option>
    <option value="ko">🇰🇷 Coreano / Korean</option>
    <option value="hi">🇮🇳 Hindi</option>
  </select>

  <label class="i18n" data-pt="Idioma de origem preferido" data-en="Preferred source language"></label>
  <select id="srcLang">
    <option value="any" class="i18n" data-pt="Qualquer (automático)" data-en="Any (automatic)">Qualquer (automático)</option>
    <option value="en">Inglês / English</option>
    <option value="ja">Japonês / Japanese</option>
    <option value="es">Espanhol / Spanish</option>
    <option value="fr">Francês / French</option>
    <option value="de">Alemão / German</option>
    <option value="it">Italiano / Italian</option>
  </select>

  <label class="i18n" data-pt="Google Translate API Key (opcional)" data-en="Google Translate API Key (optional)"></label>
  <input id="apiKey" type="password" class="i18n-placeholder"
    data-pt="Deixe vazio para usar API gratuita"
    data-en="Leave empty to use free API">
  <small class="i18n"
    data-pt="Sem chave funciona, mas pode ter limite de requisições."
    data-en="Works without a key, but may hit rate limits."></small>

  <button class="btn-install" onclick="install()">
    <span class="i18n" data-pt="🚀 Instalar no Stremio" data-en="🚀 Install on Stremio"></span>
  </button>

  <div id="result">
    <p class="i18n" data-pt="Manifest URL:" data-en="Manifest URL:"></p>
    <a id="manifest-url" class="manifest" target="_blank"></a>
    <a id="install-url" class="open-stremio" href="#">
      <span class="i18n" data-pt="Abrir no Stremio" data-en="Open in Stremio"></span>
    </a>
  </div>
</div>

<div class="debrid-card">
  <h2 class="i18n"
    data-pt="⚡ Turbine sua experiência com um Debrid"
    data-en="⚡ Supercharge your experience with a Debrid"></h2>
  <p class="i18n"
    data-pt="Para streams rápidos, sem buffer e em alta qualidade no Stremio, use um serviço de debrid. Recomendamos:"
    data-en="For fast, buffer-free, high-quality streams on Stremio, use a debrid service. We recommend:"></p>
  <div class="debrid-links">
    <a class="btn-torbox" href="https://torbox.app/subscription?referral=b08bcd10-8df2-44c9-a0ba-4d5bdb62ef96" target="_blank" rel="noopener">
      ⚡ TorBox
    </a>
    <a class="btn-rd" href="http://real-debrid.com/?id=6684575" target="_blank" rel="noopener">
      🟢 Real-Debrid
    </a>
  </div>
</div>

<footer>Auto Translate Subtitles — Powered by Google Translate</footer>

<script>
  let lang = 'pt';

  function setLang(l) {
    lang = l;
    document.querySelectorAll('.lang-toggle button').forEach(b => b.classList.remove('active'));
    document.querySelector(`.lang-toggle button:${l==='pt'?'first':'last'}-child`).classList.add('active');
    document.querySelectorAll('.i18n').forEach(el => {
      const txt = el.dataset[l];
      if (txt) el.textContent = txt;
    });
    document.querySelectorAll('.i18n-placeholder').forEach(el => {
      const txt = el.dataset[l];
      if (txt) el.placeholder = txt;
    });
    // Opção "any" no select
    const anyOpt = document.querySelector('#srcLang option[value="any"]');
    if (anyOpt) anyOpt.textContent = l === 'pt' ? 'Qualquer (automático)' : 'Any (automatic)';
  }

  function install() {
    const config = {
      targetLang: document.getElementById('targetLang').value,
      srcLang:    document.getElementById('srcLang').value,
      apiKey:     document.getElementById('apiKey').value.trim(),
    };
    const b64      = btoa(unescape(encodeURIComponent(JSON.stringify(config))));
    const manifest = `${location.origin}/${b64}/manifest.json`;
    const stremio  = `stremio://${manifest.replace(/^https?:\/\//, '')}`;
    document.getElementById('manifest-url').textContent = manifest;
    document.getElementById('manifest-url').href        = manifest;
    document.getElementById('install-url').href         = stremio;
    document.getElementById('result').style.display     = 'block';
  }

  setLang('pt');
</script>
</body>
</html>
